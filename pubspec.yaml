name: nunarivu_ai
description: "Offline Tamil/English educational AI tutor for Sri Lankan students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Image capture & gallery
  image_picker: ^1.1.2
  image: ^4.2.0

  # Storage paths
  path_provider: ^2.1.4
  path: ^1.9.0

  # Runtime permissions (camera, microphone, storage)
  permission_handler: ^11.4.0

  # Tamil speech-to-text via Google (requires internet; works out of the box)
  speech_to_text: ^7.0.0

  # Text-to-speech (read AI responses aloud in Tamil/English)
  flutter_tts: ^4.0.0

  # Reactive state management
  flutter_riverpod: ^2.6.1

  # Tamil-compatible fonts (Noto Sans Tamil)
  google_fonts: ^6.2.1

  # Theme persistence + small key-value storage
  shared_preferences: ^2.3.0

  # SQLite for offline profiles, chat history, PDF library
  sqflite: ^2.4.0

  # PDF text extraction + viewer (community license — free for individual devs)
  syncfusion_flutter_pdf: ^29.1.39
  syncfusion_flutter_pdfviewer: ^29.1.39

  # File picker for PDF import
  file_picker: ^10.0.0

  # Smooth animations for premium UI feel
  flutter_animate: ^4.5.0

  # UUID generation (cloud-sync-friendly IDs)
  uuid: ^4.5.0

  # Local notifications for study reminders & alarms
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # On-device OCR for scanned Tamil PDF textbooks
  flutter_tesseract_ocr: ^0.4.22
  pdfx: ^2.6.0


dependency_overrides:
  # permission_handler 11.x API is backwards compatible with older usage.
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tokenizer/vocab.json
    - assets/tokenizer/merges.txt
    - assets/tessdata_config.json
    - assets/tessdata/tam.traineddata
    - assets/tessdata/eng.traineddata
